name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  quality:
    name: Lint · Typecheck · Test · Build · Static gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: No focused/skipped tests
        run: pnpm check:no-skip

      - name: Secret scan
        run: pnpm check:secrets

      - name: Package boundary check
        run: pnpm check:boundaries

      - name: Docs link check
        run: pnpm check:docs

      - name: Prisma format check
        run: pnpm --filter @b2b/database exec prisma format && git diff --exit-code -- packages/database/prisma/schema.prisma

      - name: Prisma validate
        run: pnpm --filter @b2b/database db:validate

      - name: Prisma generate
        run: pnpm --filter @b2b/database db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

      - name: OpenAPI / client generation + drift
        run: pnpm check:openapi

  database:
    name: Database (real PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: b2b
          POSTGRES_PASSWORD: b2b
          POSTGRES_DB: b2b_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U b2b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://b2b:b2b@localhost:5432/b2b_test?schema=public
      SHADOW_DATABASE_URL: postgresql://b2b:b2b@localhost:5432/b2b_shadow?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Create shadow database (for drift gate)
        run: PGPASSWORD=b2b psql -h localhost -U b2b -d b2b_test -c 'CREATE DATABASE b2b_shadow;'

      - name: Build
        run: pnpm build

      - name: Prisma generate
        run: pnpm --filter @b2b/database db:generate

      - name: Migrate deploy (empty database)
        run: pnpm --filter @b2b/database db:migrate:deploy

      - name: Migrate deploy again (idempotent — no pending migrations)
        run: pnpm --filter @b2b/database db:migrate:deploy

      - name: Schema/migration drift check
        run: pnpm --filter @b2b/database db:drift

      - name: Seed (first run)
        run: pnpm --filter @b2b/database db:seed

      - name: Seed again (idempotency)
        run: pnpm --filter @b2b/database db:seed

      - name: Database integration tests
        run: pnpm --filter @b2b/database test:integration

      - name: API integration tests
        run: pnpm --filter @b2b/api test:integration

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose config
        run: |
          cp .env.example .env
          docker compose config -q
