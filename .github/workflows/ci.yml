name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  quality:
    name: Lint · Typecheck · Test · Build · Static gates
    runs-on: ubuntu-latest
    # Prisma validate/generate require DATABASE_URL to be present (they do NOT
    # connect here). A dummy non-routable URL keeps the static checks offline.
    env:
      DATABASE_URL: postgresql://prisma:prisma@localhost:5432/validate?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: No focused/skipped tests
        run: pnpm check:no-skip

      - name: Secret scan
        run: pnpm check:secrets

      - name: Package boundary check
        run: pnpm check:boundaries

      - name: Docs link check
        run: pnpm check:docs

      - name: Prisma format check
        run: pnpm --filter @b2b/database exec prisma format && git diff --exit-code -- packages/database/prisma/schema.prisma

      - name: Prisma validate
        run: pnpm --filter @b2b/database db:validate

      - name: Prisma generate
        run: pnpm --filter @b2b/database db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

      - name: OpenAPI / client generation + drift
        run: pnpm check:openapi

  database:
    name: Database (real PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: b2b
          POSTGRES_PASSWORD: b2b
          POSTGRES_DB: b2b_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U b2b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://b2b:b2b@localhost:5432/b2b_test?schema=public
      SHADOW_DATABASE_URL: postgresql://b2b:b2b@localhost:5432/b2b_shadow?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: PostgreSQL readiness
        run: PGPASSWORD=b2b pg_isready -h localhost -U b2b -d b2b_test

      - name: Create shadow database (for drift gate)
        run: PGPASSWORD=b2b psql -h localhost -U b2b -d b2b_test -c 'CREATE DATABASE b2b_shadow;'

      - name: Prisma format check
        run: pnpm --filter @b2b/database exec prisma format && git diff --exit-code -- packages/database/prisma/schema.prisma

      - name: Prisma validate
        run: pnpm --filter @b2b/database db:validate

      - name: Prisma generate
        run: pnpm --filter @b2b/database db:generate

      - name: Build
        run: pnpm build

      - name: Migrate deploy (empty database)
        run: pnpm --filter @b2b/database db:migrate:deploy

      - name: Migrate deploy again (idempotent — no pending migrations)
        run: pnpm --filter @b2b/database db:migrate:deploy

      - name: Schema/migration drift check
        run: pnpm --filter @b2b/database db:drift

      - name: Seed (first run)
        run: pnpm --filter @b2b/database db:seed

      - name: Seed again (idempotency)
        run: pnpm --filter @b2b/database db:seed

      # Fail-closed database gate: this command exits non-zero if the database is
      # unreachable, if zero DB tests are collected, or if any DB test is skipped
      # — and it rejects skip-bypass env vars in CI. It runs the full real-Postgres
      # integration suite (immutable/cascade, customer default address, import
      # duplicate policy, effect-receipt FK & state, drift/catalog probes).
      - name: Database integration tests (fail-closed gate)
        run: pnpm --filter @b2b/database test:integration:db

      - name: Schema catalog verification
        run: pnpm --filter @b2b/database db:verify-catalog

      - name: Assert no skipped DB tests / conditional skips
        run: pnpm check:no-skip

      - name: API integration tests
        run: pnpm --filter @b2b/api test:integration

  authentication:
    name: Authentication (real PostgreSQL + Playwright E2E)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: b2b
          POSTGRES_PASSWORD: b2b
          POSTGRES_DB: b2b_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U b2b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://b2b:b2b@localhost:5432/b2b_auth_test?schema=public
      JWT_ACCESS_SECRET: ci-only-access-secret-at-least-32-characters-long
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: PostgreSQL readiness
        run: PGPASSWORD=b2b pg_isready -h localhost -U b2b -d b2b_auth_test

      - name: Prisma generate
        run: pnpm --filter @b2b/database db:generate

      - name: Build
        run: pnpm build

      - name: Migrate deploy
        run: pnpm --filter @b2b/database db:migrate:deploy

      - name: Auth unit tests
        run: pnpm --filter @b2b/api test:unit

      # Fail-closed: real-PostgreSQL API integration + concurrency suites. Exits
      # non-zero on an unreachable DB, zero collected tests, or any skipped test.
      - name: Auth API + DB integration + concurrency (fail-closed gate)
        run: pnpm --filter @b2b/api test:integration

      - name: Install Playwright Chromium
        run: pnpm --filter @b2b/web exec playwright install --with-deps chromium

      # Web build must inline NEXT_PUBLIC_API_BASE_URL; rebuild it with the value.
      - name: Build web with API base URL
        run: pnpm --filter @b2b/web build

      - name: E2E (Playwright, real browser → web → API → PostgreSQL)
        run: pnpm --filter @b2b/web test:e2e

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose config
        run: |
          cp .env.example .env
          docker compose config -q
