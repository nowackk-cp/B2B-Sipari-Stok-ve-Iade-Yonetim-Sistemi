# Local development infrastructure for the B2B Operations Suite.
#
# Services: PostgreSQL, Redis, MinIO (+ bucket init), Mailpit.
# Application containers (api/web/worker) are NOT included here — they run from
# source via `pnpm dev` during development.
#
# All credentials below are DEVELOPMENT-ONLY defaults. NEVER use them in
# production; production secrets are injected via the deployment platform's
# secret manager (see .env.example "Production secret management").
#
# Validate without starting: `docker compose config`
# Start:                     `docker compose up -d`

name: b2b-ops

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-b2b}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-b2b_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-b2b}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-b2b} -d ${POSTGRES_DB:-b2b}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-b2b_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-b2b_minio_dev_password}
    ports:
      - '${MINIO_PORT:-9000}:9000' # S3 API
      - '${MINIO_CONSOLE_PORT:-9001}:9001' # Web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot bucket initialization; exits after creating the bucket.
  minio-setup:
    image: minio/mc:latest
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-b2b_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-b2b_minio_dev_password}
      S3_BUCKET: ${S3_BUCKET:-b2b-files}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${S3_BUCKET}"
        mc anonymous set none "local/$${S3_BUCKET}"
        echo "MinIO bucket '$${S3_BUCKET}' is ready (private)."

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025' # SMTP
      - '${MAILPIT_UI_PORT:-8025}:8025' # Web UI
    volumes:
      - mailpitdata:/data
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:8025/readyz']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
  redisdata:
  miniodata:
  mailpitdata:
